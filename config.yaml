# bot配置
bot:
  # 管理员信息
  admin_id: # 管理员qq

  # napcat网络交换适配器，websocket/http二选一
  adapter:
    ws:
      address: ws://localhost:4455 # websocket 地址，napcat的ws server地址
      max_retries: 5 # 连接失败时最大重连次数
      worker_count: 0 # 处理线程数，设置为0自动调整
      worker_queue_size: 1024 # 消息队列，消息超出此限制则丢弃消息
    http:
      listen_port: 6679 # 本地监听端口，用于napcat向bot上报事件。注意这里如果是docker的话使用localhost无法连接，建议换成内网ip，即在napcat配置页面的http client设置为ip
      target_url: http://localhost:6680 # napcat开放的url，用于bot向napcat上报事件

  # 插件存储适配器
  store:
    # 默认redis适配器
    redis:
      address: "localhost:6379"
      password: ""
      db: 0

# 插件自定义配置
plugin:
  # AniaBot系统AI对话插件配置
  ai_chat_bot:
    base_url: "https://api.deepseek.com" # 示例deepseek，支持所有兼容OpenAI规范的厂商
    api_key: "" # 这里填写apikey
    model: "deepseek-chat" # 选择的模型
    # 工具调用
    search:
      token: "xxx" # jina ai token
    # 模型参数
    temperature: 1.2
    top_p: 0.9
    top_k: 100
    max_token: 8192
    prompt: |-
      你是一个ai对话机器人，在QQ上和别人聊天，说话不要长篇大论

    mcp:
      servers:
        # # HTTP 模式 MCP 服务器
        # - name: "remote-mcp-server"
        #   transport: "http"
        #   endpoint: "http://localhost:3000"
        #   headers:
        #     Authorization: "Bearer token123"
        #   timeout: 30
        
        # # Streamable HTTP 模式
        # - name: "streamable-mcp"
        #   transport: "streamable"
        #   endpoint: "http://localhost:3001"
        #   timeout: 60
        
        # # Stdio 模式 MCP 服务器
        # - name: "local-python-mcp"
        #   transport: "stdio"
        #   command: "python"
        #   args:
        #     - "-m"
        #     - "mcp_server"
        #   env:
        #     API_KEY: "xxx"
        #     DEBUG: "true"
        #   timeout: 30

    # OCR 配置，可选，该llm负责将图片转换为文本供上文使用
    ocr:
      enable: false
      base_url: "https://api.siliconflow.cn/v1" # 示例deepseek，支持所有兼容OpenAI规范的厂商
      api_key: "" # 这里填写apikey
      model: "Qwen/Qwen3-VL-8B-Instruct" # 选择的模型
      # 模型参数
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      max_token: 600
      prompt: |-
        你负责将看到的图片用markdown格式描述出来，不要有无关的其他对话

  # 每日新闻插件
  dailyNews:
    api: "https://60s.viki.moe/v2/60s?encoding=image-proxy" # api端点
    cron: "0 18 * * *" # cron表达式, 每天18点触发
    groups: # 指定需要定时播报的群聊
      - 123456
      - 7891011

  # GithubRepoer插件
  github_repoer:
    max_token: 100000 # 上下文限制
    fmt: "md" # 输出格式 md或jpg
    model:
      base_url: "https://api.deepseek.com"
      api_key: ""
      model: "deepseek-chat"
      prompt: |-
        你是Github项目专业分析师，负责分析用户提供的代码项目质量，并给出报告和打分
        你最终的输出结果应该只包含报告，不要有其他无关解释和讨论


  # 拦截器插件
  interceptor: # 优先级: 黑名单 > 白名单 > 其他
    # 黑名单
    blacklist:
      users:
        - 123
        - 456
      groups:
        - 123
        - 456
    # 白名单
    whitelist:
      users:
        - "all"
      groups:
        - "all"

  # 群刊插件
  group_newsletter:
    fmt: "md" # 输出格式 md或jpg
    model:
      base_url: "https://api.openai.com/v1"
      api_key: "your-api-key"
      model: "gpt-4"
      prompt: ""  # 可选，留空使用默认prompt
    msg_threshold: 100  # 消息阈值
    max_messages: 500   # 最大保存消息数
    enabled_groups: []  # 留空表示所有群启用，或填写群号列表

  # gdmusic插件
  gdmusic:
    base_url: "https://music-api.gdstudio.xyz/api.php"  # 留空使用默认

  # url解析插件
  url_parser:
    cache_ttl: 60 # 缓存时间，单位分钟
    token: "xxx" # jina ai token
    llm:
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      api_key: ""
      model: "GLM-4-Flash-250414"

component:
  md2img:
    apipoint: "http://localhost:3000"