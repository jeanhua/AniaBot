# bot配置
bot:
  # 管理员信息
  admin_id: # 管理员qq

  # napcat网络交换适配器，websocket/http二选一
  adapter:
    # token: 如果设置token，请设置该字段
    ws:
      address: ws://localhost:4455 # websocket 地址，napcat的ws server地址
      max_retries: 5 # 连接失败时最大重连次数
      worker_count: 0 # 处理线程数，设置为0自动调整
      worker_queue_size: 1024 # 消息队列，消息超出此限制则丢弃消息
    http:
      listen_port: 6679 # 本地监听端口，用于napcat向bot上报事件。注意这里如果是docker的话使用localhost无法连接，建议换成内网ip，即在napcat配置页面的http client设置为ip
      target_url: http://localhost:6680 # napcat开放的url，用于bot向napcat上报事件

  # 存储适配器（缓存 + 持久化两层，独立配置、互不影响）
  store:
    # 缓存存储：易失，支持 TTL 与列表语义，适合热数据/临时会话/分布式锁
    cache:
      driver: redis # redis（默认，需 Redis 服务） | memory（进程内内存，零依赖，重启清空）
      redis:
        address: "localhost:6379"
        password: ""
        db: 0
      # memory 引擎无需任何配置

    # 持久化存储：重启不丢失，适合需要长期保存的数据（插件配置/用户数据/历史记录等）
    persistent:
      driver: sqlite # sqlite（默认，纯 Go 无 CGO） | mysql
      sqlite:
        path: "./data/aniabot.db" # 数据库文件路径，目录不存在会自动创建
      mysql:
        # 标准 go-sql-driver DSN，charset=utf8mb4 建议保留
        dsn: "root:password@tcp(localhost:3306)/aniabot?charset=utf8mb4&parseTime=true&loc=Local"
        max_open_conns: 20 # 最大连接数，<=0 时使用默认值 10
        max_idle_conns: 5 # 最大空闲连接数，<=0 时使用默认值 5
        conn_max_lifetime_sec: 300 # 连接最长存活时间（秒），<=0 时默认 1800

# 插件自定义配置
plugin:
  # AniaBot系统AI对话插件配置
  ai_chat_bot:
    base_url: "https://api.deepseek.com" # 示例deepseek，支持所有兼容OpenAI规范的厂商
    api_key: "" # 这里填写apikey
    model: "deepseek-chat" # 选择的模型
    multimodal: false # 主对话模型是否支持图片输入；开启后由模型按需调用工具直接加载图片
    rate_limit: 2 # 速率限制，每秒最多调用次数

    # 工具调用
    search:
      token: "xxx" # jina ai token
    # 模型参数
    max_context_tokens: 128000
    temperature: 1.2
    top_p: 0.9
    top_k: 100
    max_token: 8192
    # 深度思考配置
    thinking:
      enable: false  # 是否启用深度思考
      mode: "auto"   # 思考模式：none / low / medium / high / auto
    prompt: |-
      你是一个ai对话机器人，在QQ上和别人聊天，说话不要长篇大论

      ## 注意
      - 当你不理解用户的问题时，要先获取用户最近的历史消息，再根据历史消息回答用户的问题

    skills_dir: "./skills"
    skills: []           # 指定加载的 skill 名称列表，为空则加载全部

    # bash 工具配置（直接在宿主机执行bash命令）
    bash:
      enable: false           # 是否启用bash工具
      shell: "/bin/bash"      # shell 路径
      env: []                 # 环境变量，格式 KEY=VALUE，如 ["HOME=/root", "LANG=zh_CN.UTF-8"]
      whitelist: []           # 非空时只允许匹配这些正则的命令，如 ["^ls", "^cat"]
      blacklist:              # 匹配这些正则的命令被禁止
        - config(\.dev)?\.(yaml|yml|json)
        - "^mkfs"
        - "^shutdown"
        - "^reboot"

    # 备用图片识别模型。主模型不支持多模态时，按需将图片转换为文字；不配置则明确告知模型无法加载图片
    ocr:
      enable: false
      base_url: "https://api.siliconflow.cn/v1" # 示例deepseek，支持所有兼容OpenAI规范的厂商
      api_key: "" # 这里填写apikey
      model: "Qwen/Qwen3-VL-8B-Instruct" # 选择的模型
      # 模型参数
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      max_token: 600
      prompt: |-
        你负责将看到的图片用markdown格式描述出来，不要有无关的其他对话

    # local_image 工具配置（读取宿主机本地图片供AI查看）
    # 主模型支持多模态时，图片以 data URI 形式放入下一轮上下文由模型直接查看；
    # 不支持多模态时，转交上方 ocr 备用模型描述。注意：可读取宿主机上任意可读
    # 图片文件，有泄露敏感截图风险，故默认关闭、需显式开启（与 bash/file 同级风险）。
    local_image:
      enable: false           # 是否启用本地图片读取工具

  # 每日新闻插件
  dailyNews:
    api: "https://60s.viki.moe/v2/60s?encoding=image-proxy" # api端点
    cron: "0 18 * * *" # cron表达式, 每天18点触发
    groups: # 指定需要定时播报的群聊
      - 123456
      - 7891011


