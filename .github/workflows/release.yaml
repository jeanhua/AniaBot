name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: make web && go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Show coverage
        run: go tool cover -func=coverage.out

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${CURRENT_TAG}$" \
            | head -n 1 || true)

          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "range=${PREV_TAG}..${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
            echo "prev=${PREV_TAG:0:7} (initial commit)" >> "$GITHUB_OUTPUT"
          else
            echo "range=${PREV_TAG}..${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
            echo "prev=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          fi

      # 优先从 CHANGELOG.md 提取当前版本段落；缺失时回退到基于 git log 的自动生成
      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RANGE="${{ steps.prev_tag.outputs.range }}"

          SECTION=$(awk -v v="$VERSION" '
            (index($0, "## [" v "]") == 1 || index($0, "## [v" v "]") == 1) { found=1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba}')

          if [ -n "$SECTION" ]; then
            {
              echo "body<<EOF"
              echo "$SECTION"
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev }}...${GITHUB_REF_NAME}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "CHANGELOG.md 中未找到 ${GITHUB_REF_NAME} 段落，回退到 git log 生成" >&2

          FEATURES=$(git log "$RANGE" --pretty="- %s (%h)" \
            | grep -E '^- feat(\(.+\))?!?:' || true)
          FIXES=$(git log "$RANGE" --pretty="- %s (%h)" \
            | grep -E '^- fix(\(.+\))?!?:' || true)
          OTHERS=$(git log "$RANGE" --pretty="- %s (%h)" \
            | grep -vE '^- (feat|fix)(\(.+\))?!?:' || true)

          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo ""
            echo "> Commits from \`${{ steps.prev_tag.outputs.prev }}\` → \`${GITHUB_REF_NAME}\`"
            echo ""

            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES"
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            if [ -n "$OTHERS" ]; then
              echo "### 🔧 Other Changes"
              echo "$OTHERS"
              echo ""
            fi

            echo "**Full diff:** https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev }}...${GITHUB_REF_NAME}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
