name: docker

# 打 v*.*.* 标签 → 构建并推送版本号镜像 + latest；
# 手动触发（Actions 页 workflow_dispatch，选 main）→ 仅更新 latest
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 构建 arm64 镜像时需要（前端在 QEMU 模拟下构建较慢）
      # - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # 打标签时取对应版本段落；手动触发时取 CHANGELOG 第一个版本段落
      - name: 从 CHANGELOG 提取镜像描述
        id: changelog
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SECTION=$(awk -v v="$VERSION" '
              (index($0, "## [" v "]") == 1 || index($0, "## [v" v "]") == 1) { found=1; next }
              found && substr($0, 1, 4) == "## [" { exit }
              found
            ' CHANGELOG.md)
          else
            SECTION=$(awk '
              substr($0, 1, 4) == "## [" { if (found) exit; found=1; next }
              found
            ' CHANGELOG.md)
          fi

          # OCI description 为单行：去掉标题符号并压平，截断到 500 字符
          DESC=$(printf '%s\n' "$SECTION" | sed '/^$/d; s/^#\+ *//' | paste -sd' ' - | LC_ALL=C.UTF-8 cut -c1-500)

          if [ -z "$DESC" ]; then
            DESC="AniaBot - 插件化 QQ 机器人框架"
            echo "CHANGELOG 中未提取到内容，使用默认描述" >&2
          fi

          echo "description=$DESC" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/aniabot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.description=${{ steps.changelog.outputs.description }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # 如需 arm64（树莓派 / ARM VPS），改为: linux/amd64,linux/arm64
          # 并取消上方 qemu 步骤注释（前端在 QEMU 下构建较慢）
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
