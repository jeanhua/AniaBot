# AniaBot 默认配置（首次启动时写入数据库，之后请在 Web 控制面板中修改）
# 持久化存储位置由环境变量引导（ANIABOT_STORE_DRIVER / ANIABOT_SQLITE_PATH / ANIABOT_MYSQL_DSN），不在此处配置
bot:
  # 管理员信息
  admin_id: # 管理员qq

  # Web 控制面板
  admin_panel:
    enable: true # 是否启用 Web 控制面板
    listen: "127.0.0.1:7700" # 监听地址（如需局域网访问改为 0.0.0.0:7700，注意面板有密码保护）

  # napcat网络交换适配器，websocket/http二选一
  adapter:
    # token: 如果设置token，请设置该字段
    ws:
      address: ws://localhost:4455 # websocket 地址，napcat的ws server地址
      worker_count: 0 # 处理线程数，设置为0自动调整
      worker_queue_size: 1024 # 消息队列，消息超出此限制则丢弃消息
    http:
      listen_port: 6679 # 本地监听端口，用于napcat向bot上报事件。注意这里如果是docker的话使用localhost无法连接，建议换成内网ip，即在napcat配置页面的http client设置为ip
      target_url: http://localhost:6680 # napcat开放的url，用于bot向napcat上报事件

  # 缓存存储（易失，支持 TTL 与列表语义）
  store:
    cache:
      driver: memory # memory（默认，进程内内存，零依赖，重启清空） | redis（需 Redis 服务，支持多实例共享）
      redis:
        address: "localhost:6379"
        password: ""
        db: 0

# 原独立 JSON 配置文件的内容（MCP 服务器 / 群与好友 Prompt 覆盖），在 Web 面板「文件」页编辑
files:
  mcp_json: ""
  prompt_json: ""

# 插件自定义配置
plugin:

  # 拦截器插件
  interceptor: # 优先级: 黑名单 > 白名单 > 其他
    # 黑名单
    blacklist:
      users: []
      groups: []
    # 白名单
    whitelist:
      users:
        - "all"
      groups:
        - "all"

  # 群刊插件
  group_newsletter:
    fmt: "md" # 输出格式 md或jpg, jpg需要先启动md2img-api容器: docker run -d -p 3000:3000 --name md2img-api jeanhua/md2img-api:latest
    model:
      base_url: "https://api.openai.com/v1"
      api_key: "your-api-key"
      model: "gpt-4"
      prompt: ""  # 可选，留空使用默认prompt
    msg_threshold: 100  # 消息阈值
    max_messages: 500   # 最大保存消息数
    enabled_groups: []  # 留空表示所有群启用，或填写群号列表

  # gdmusic插件
  gdmusic:
    base_url: "https://music-api.gdstudio.xyz/api.php"  # 留空使用默认

  # url解析插件
  url_parser:
    cache_ttl: 60 # 缓存时间，单位分钟
    token: "xxx" # jina ai token
    llm:
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      api_key: ""
      model: "GLM-4-Flash-250414"

component:
  md2img:
    apipoint: "http://localhost:3000"
