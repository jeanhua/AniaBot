# AniaBot 默认配置（首次启动时写入数据库，之后请在 Web 控制面板中修改）
# 持久化存储位置由环境变量引导（ANIABOT_STORE_DRIVER / ANIABOT_SQLITE_PATH / ANIABOT_MYSQL_DSN），不在此处配置
bot:
  # 管理员信息
  admin_id: # 管理员qq

  # Web 控制面板
  admin_panel:
    enable: true # 是否启用 Web 控制面板
    listen: "127.0.0.1:7700" # 监听地址（如需局域网访问改为 0.0.0.0:7700，注意面板有密码保护）

  # napcat网络交换适配器，websocket/http二选一
  adapter:
    # token: 如果设置token，请设置该字段
    ws:
      address: ws://localhost:4455 # websocket 地址，napcat的ws server地址
      max_retries: 5 # 连接失败时最大重连次数
      worker_count: 0 # 处理线程数，设置为0自动调整
      worker_queue_size: 1024 # 消息队列，消息超出此限制则丢弃消息
    http:
      listen_port: 6679 # 本地监听端口，用于napcat向bot上报事件。注意这里如果是docker的话使用localhost无法连接，建议换成内网ip，即在napcat配置页面的http client设置为ip
      target_url: http://localhost:6680 # napcat开放的url，用于bot向napcat上报事件

  # 缓存存储（易失，支持 TTL 与列表语义）
  store:
    cache:
      driver: memory # memory（默认，进程内内存，零依赖，重启清空） | redis（需 Redis 服务，支持多实例共享）
      redis:
        address: "localhost:6379"
        password: ""
        db: 0

# 原独立 JSON 配置文件的内容（MCP 服务器 / 群与好友 Prompt 覆盖），在 Web 面板「文件」页编辑
files:
  mcp_json: ""
  prompt_json: ""

# 插件自定义配置
plugin:
  # AniaBot系统AI对话插件配置
  ai_chat_bot:
    base_url: "https://api.deepseek.com" # 示例deepseek，支持所有兼容OpenAI规范的厂商
    api_key: "" # 这里填写apikey
    model: "deepseek-chat" # 选择的模型
    multimodal: false # 主对话模型是否支持图片输入；开启后由模型按需调用工具直接加载图片
    rate_limit: 2 # 速率限制，每秒最多调用次数

    # 工具调用
    search:
      token: "xxx" # jina ai token
    # 模型参数
    max_context_tokens: 128000
    temperature: 1.2
    top_p: 0.9
    top_k: 100
    max_token: 8192
    # 深度思考配置
    thinking:
      enable: false  # 是否启用深度思考
      mode: "auto"   # 思考模式：none / low / medium / high / auto
    prompt: |-
      你是一个ai对话机器人，在QQ上和别人聊天，说话不要长篇大论

      ## 注意
      - 当你不理解用户的问题时，要先获取用户最近的历史消息，再根据历史消息回答用户的问题

    skills_dir: "./skills"
    skills: []           # 指定加载的 skill 名称列表，为空则加载全部

    # bash 工具配置（直接在宿主机执行bash命令）
    bash:
      enable: false           # 是否启用bash工具
      shell: "/bin/bash"      # shell 路径
      env: []                 # 环境变量，格式 KEY=VALUE，如 ["HOME=/root", "LANG=zh_CN.UTF-8"]
      whitelist: []           # 非空时只允许匹配这些正则的命令，如 ["^ls", "^cat"]
      blacklist:              # 匹配这些正则的命令被禁止
        - config(\.dev)?\.(yaml|yml|json)  # 旧版配置文件（含敏感信息）
        - "^mkfs"
        - "^shutdown"
        - "^reboot"

    # 备用图片识别模型。主模型不支持多模态时，按需将图片转换为文字；不配置则明确告知模型无法加载图片
    ocr:
      enable: false
      base_url: "https://api.siliconflow.cn/v1" # 示例deepseek，支持所有兼容OpenAI规范的厂商
      api_key: "" # 这里填写apikey
      model: "Qwen/Qwen3-VL-8B-Instruct" # 选择的模型
      # 模型参数
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      max_token: 600
      prompt: |-
        你负责将看到的图片用markdown格式描述出来，不要有无关的其他对话

    # local_image 工具配置（读取宿主机本地图片供AI查看）
    local_image:
      enable: false           # 是否启用本地图片读取工具

    # AI 定时任务（clock）配置
    clock:
      enable: true                # 是否启用定时任务功能
      default_timeout_sec: 120    # 单次触发默认超时（秒），超时会记录到执行日志并中止
      max_log_entries: 500        # 执行日志保留条数（滚动覆盖）

    # AI 长期记忆（memory）配置
    memory:
      enable: true                # 是否启用长期记忆功能
      max_entries: 200            # 单个会话（群/好友）的记忆条数上限，写满后 AI 需先清理旧记忆

  # 每日新闻插件
  dailyNews:
    api: "https://60s.viki.moe/v2/60s?encoding=image-proxy" # api端点
    cron: "0 18 * * *" # cron表达式, 每天18点触发
    groups: # 指定需要定时播报的群聊
      - 123456
      - 7891011



  # 拦截器插件
  interceptor: # 优先级: 黑名单 > 白名单 > 其他
    # 黑名单
    blacklist:
      users: []
      groups: []
    # 白名单
    whitelist:
      users:
        - "all"
      groups:
        - "all"

  # 群刊插件
  group_newsletter:
    fmt: "md" # 输出格式 md或jpg, jpg需要先启动md2img-api容器: docker run -d -p 3000:3000 --name md2img-api jeanhua/md2img-api:latest
    model:
      base_url: "https://api.openai.com/v1"
      api_key: "your-api-key"
      model: "gpt-4"
      prompt: ""  # 可选，留空使用默认prompt
    msg_threshold: 100  # 消息阈值
    max_messages: 500   # 最大保存消息数
    enabled_groups: []  # 留空表示所有群启用，或填写群号列表

  # gdmusic插件
  gdmusic:
    base_url: "https://music-api.gdstudio.xyz/api.php"  # 留空使用默认

  # url解析插件
  url_parser:
    cache_ttl: 60 # 缓存时间，单位分钟
    token: "xxx" # jina ai token
    llm:
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      api_key: ""
      model: "GLM-4-Flash-250414"

component:
  md2img:
    apipoint: "http://localhost:3000"
